<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ro‘yxatdan o‘tish</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">JP NihongoHub</a><a href="/">← Bosh sahifa</a></header><main class="auth-wrap"><section class="auth-card"><h1>Hisob yarating</h1><h2>O‘rganishni boshlang</h2><form id="form"><div class="field"><label for="name">Ism</label><input id="name" minlength="2" maxlength="80" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Parol</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><p id="message" class="form-error"></p><button class="btn wide">Ro‘yxatdan o‘tish</button></form><p>Akkauntingiz bormi? <a href="/login.html">Kirish</a></p></section></main><script src="/app.js"></script><script>document.getElementById("form").onsubmit=async e=>{e.preventDefault();let m=document.getElementById("message");try{await api("/api/register",{method:"POST",body:JSON.stringify({name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});location.replace("/dashboard.html")}catch(x){msg(m,x.message)}};</script></body></html>
