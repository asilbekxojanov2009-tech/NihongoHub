<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">NihongoHub Admin</a><nav class="nav"><a href="/admin/users.html">Foydalanuvchilar</a><a href="/admin/lessons.html">Darslar</a><button id="out" class="btn secondary">Chiqish</button></nav></header><main class="container"><h1>Admin panel</h1><p id="who" class="muted"></p><div id="stats" class="grid"></div></main><script src="/app.js"></script><script>(async()=>{try{let m=await api("/api/me");if(m.role!=="admin"){location.replace(m.role==="user"?"/dashboard.html":"/admin/login.html");return}who.textContent="Admin: "+m.admin.username;let s=await api("/api/admin/stats");stats.innerHTML=`<div class="stat"><strong>${s.users}</strong><span>Foydalanuvchilar</span></div><div class="stat"><strong>${s.lessons}</strong><span>Darslar</span></div><div class="stat"><strong>${s.quizzes}</strong><span>Testlar</span></div>`}catch(e){location.replace("/admin/login.html")}})();out.onclick=logout</script></body></html>
