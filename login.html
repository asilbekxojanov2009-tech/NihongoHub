<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirish — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">🇯🇵 NihongoHub</a><a class="nav-link" href="/">← Bosh sahifa</a></nav><main class="auth-wrap"><section class="auth-card"><h1>Xush kelibsiz!</h1><h2>Akkauntingizga kiring</h2><form id="form" class="form"><label>Email<input id="email" type="email" required autocomplete="email" placeholder="email@example.com"></label><label>Parol<input id="password" type="password" required autocomplete="current-password" placeholder="Parolingiz"></label><button class="primary" type="submit">Kirish</button></form><p class="message" id="message"></p><p class="muted">Akkauntingiz yo‘qmi? <a href="/register.html">Ro‘yxatdan o‘tish</a></p></section></main><script>
const form=document.getElementById('form'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message);location.href='/dashboard.html'}catch(e){msg.textContent=e.message;msg.className='message error'}});
</script></body></html>
