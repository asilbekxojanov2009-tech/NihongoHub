<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin kirishi</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">JP NihongoHub Admin</a></header><main class="auth-wrap"><section class="auth-card"><h1>Admin panel</h1><form id="form"><div class="field"><label for="username">Username</label><input id="username" required></div><div class="field"><label for="password">Parol</label><input id="password" type="password" required></div><p id="message" class="form-error"></p><button class="btn wide">Kirish</button></form></section></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:username.value.trim(),password:password.value})});location.replace("/admin/dashboard.html")}catch(x){msg(message,x.message)}}</script></body></html>
