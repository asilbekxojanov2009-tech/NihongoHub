<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foydalanuvchilar — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">👨‍💻 NihongoHub Admin</a><a class="button secondary" href="/admin/dashboard.html">← Admin panel</a></nav><main class="page"><div class="page-heading"><div><h1>👥 Foydalanuvchilar</h1><p class="muted">Akkauntlarni ko‘rish va boshqarish.</p></div></div><div id="users" class="table-wrap">Yuklanmoqda...</div><p id="message" class="message"></p></main><script>
async function init(){const me=await fetch('/api/me');if(!me.ok){location.href='/admin/login.html';return}const md=await me.json();if(md.role!=='admin'){location.href='/login.html';return}load()}async function load(){const box=document.getElementById('users');const r=await fetch('/api/admin/users');if(!r.ok){box.textContent='Foydalanuvchilarni yuklab bo‘lmadi.';return}const users=await r.json();if(!users.length){box.innerHTML='<div class="empty">Hozircha foydalanuvchi yo‘q.</div>';return}box.innerHTML='<table class="table"><thead><tr><th>ID</th><th>Ism</th><th>Email</th><th>Rol</th><th>Yaratilgan</th><th>Amal</th></tr></thead><tbody>'+users.map(u=>`<tr><td>${u.id}</td><td class="name"></td><td class="email"></td><td>${u.role}</td><td>${u.created_at}</td><td><button class="danger small-btn" data-id="${u.id}">O‘chirish</button></td></tr>`).join('')+'</tbody></table>';const rows=box.querySelectorAll('tbody tr');users.forEach((u,i)=>{rows[i].querySelector('.name').textContent=u.name;rows[i].querySelector('.email').textContent=u.email});box.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Ushbu foydalanuvchini butunlay o‘chirasizmi?'))return;const r=await fetch('/api/admin/users/'+b.dataset.id,{method:'DELETE'});const d=await r.json();if(!r.ok){alert(d.message);return}load()})}init().catch(()=>location.href='/admin/login.html');
</script></body></html>
