<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darslarni boshqarish</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/admin/dashboard.html">Admin</a></header><main class="container"><h1>Darslarni boshqarish</h1><section class="panel"><form id="form"><input id="id" type="hidden"><div class="field"><label for="title">Nomi</label><input id="title" required></div><div class="field"><label for="description">Tavsif</label><input id="description" required></div><div class="field"><label for="level">Daraja</label><select id="level"><option>N5</option><option>N4</option></select></div><div class="field"><label for="content">Mazmun</label><textarea id="content" rows="6"></textarea></div><button class="btn">Saqlash</button><button type="button" class="btn secondary" onclick="form.reset();id.value=''">Tozalash</button></form><p id="message" class="form-error"></p></section><div id="table" class="table-wrap"></div></main><script src="/app.js"></script><script>let rows=[];async function load(){try{rows=await api("/api/admin/lessons");table.innerHTML=`<table><tr><th>ID</th><th>Nomi</th><th>Daraja</th><th></th></tr>${rows.map(x=>`<tr><td>${x.id}</td><td>${esc(x.title)}</td><td>${x.level}</td><td><button class="btn secondary" onclick="edit(${x.id})">Tahrir</button> <button class="btn" onclick="del(${x.id})">O‘chirish</button></td></tr>`).join("")}</table>`}catch(e){location.replace("/admin/login.html")}}function edit(i){let x=rows.find(a=>a.id===i);id.value=x.id;title.value=x.title;description.value=x.description;level.value=x.level;content.value=x.content}form.onsubmit=async e=>{e.preventDefault();let i=id.value,b={title:title.value,description:description.value,level:level.value,content:content.value};try{await api(i?"/api/admin/lessons/"+i:"/api/admin/lessons",{method:i?"PUT":"POST",body:JSON.stringify(b)});msg(message,"Saqlandi",true);form.reset();id.value="";load()}catch(x){msg(message,x.message)}};async function del(i){if(confirm("Darsni o‘chirasizmi?")){await api("/api/admin/lessons/"+i,{method:"DELETE"});load()}}load()</script></body></html>
