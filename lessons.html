<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darslarni boshqarish — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">👨‍💻 NihongoHub Admin</a><a class="button secondary" href="/admin/dashboard.html">← Admin panel</a></nav><main class="page"><div class="page-heading"><div><h1>📚 Darslarni boshqarish</h1><p class="muted">N5 va N4 darslarini yaratish va tahrirlash.</p></div></div><div class="card" style="margin-bottom:28px"><h2 id="formTitle">Yangi dars qo‘shish</h2><form id="lessonForm" class="form"><input id="id" type="hidden"><label>Dars nomi<input id="title" required maxlength="160" placeholder="Masalan: Hiragana bilan tanishuv"></label><label>Qisqacha tavsif<input id="description" required maxlength="500" placeholder="Darsda nimalarni o‘rganamiz?"></label><label>Daraja<select id="level" required><option value="N5">JLPT N5</option><option value="N4">JLPT N4</option></select></label><label>Dars matni<textarea id="content" placeholder="Yaponcha matn, tarjima, misollar va mashqlar..."></textarea></label><div class="actions"><button class="primary" type="submit">Saqlash</button><button class="secondary" type="button" id="cancel" hidden>Bekor qilish</button></div></form><p id="message" class="message"></p></div><h2>Barcha darslar</h2><div id="list" class="table-wrap" style="margin-top:16px">Yuklanmoqda...</div></main><script>
const form=document.getElementById('lessonForm'),msg=document.getElementById('message');function resetForm(){form.reset();document.getElementById('id').value='';document.getElementById('formTitle').textContent='Yangi dars qo‘shish';document.getElementById('cancel').hidden=true}document.getElementById('cancel').onclick=resetForm;form.onsubmit=async e=>{e.preventDefault();const id=document.getElementById('id').value;const data={title:title.value,description:description.value,level:level.value,content:content.value};try{const r=await fetch('/api/admin/lessons'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.message);msg.textContent=d.message;msg.className='message success';resetForm();load()}catch(e){msg.textContent=e.message;msg.className='message error'}};async function load(){const me=await fetch('/api/me');if(!me.ok){location.href='/admin/login.html';return}const md=await me.json();if(md.role!=='admin'){location.href='/login.html';return}const r=await fetch('/api/admin/lessons');const lessons=await r.json();const list=document.getElementById('list');if(!lessons.length){list.innerHTML='<div class="empty">Hozircha darslar yo‘q.</div>';return}list.innerHTML='<table class="table"><thead><tr><th>ID</th><th>Dars</th><th>Daraja</th><th>Amallar</th></tr></thead><tbody>'+lessons.map(l=>`<tr><td>${l.id}</td><td class="title"></td><td><span class="level-pill">${l.level}</span></td><td><div class="actions"><button class="secondary small-btn" data-edit="${l.id}">Tahrirlash</button><button class="danger small-btn" data-delete="${l.id}">O‘chirish</button></div></td></tr>`).join('')+'</tbody></table>';const rows=list.querySelectorAll('tbody tr');lessons.forEach((l,i)=>{rows[i].querySelector('.title').textContent=l.title});list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const l=lessons.find(x=>x.id===Number(b.dataset.edit));document.getElementById('id').value=l.id;title.value=l.title;description.value=l.description;level.value=l.level;content.value=l.content;document.getElementById('formTitle').textContent='Darsni tahrirlash';document.getElementById('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'})});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Bu darsni o‘chirishni tasdiqlaysizmi?'))return;const r=await fetch('/api/admin/lessons/'+b.dataset.delete,{method:'DELETE'});const d=await r.json();if(!r.ok){alert(d.message);return}load()})}load().catch(()=>location.href='/admin/login.html');
</script></body></html>
