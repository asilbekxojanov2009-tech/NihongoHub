<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natijalar</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">JP NihongoHub</a><a href="/dashboard.html">Kabinet</a></header><main class="container"><h1>Natijalarim</h1><div id="summary" class="grid"></div><div id="results" class="table-wrap"></div><p id="message" class="form-error"></p></main><script src="/app.js"></script><script>api("/api/progress").then(d=>{summary.innerHTML=`<div class="stat"><strong>${d.completedLessons}/${d.totalLessons}</strong><span>Darslar</span></div><div class="stat"><strong>${d.percent}%</strong><span>Rivojlanish</span></div>`;results.innerHTML=d.quizzes.length?`<table><tr><th>Daraja</th><th>Ball</th><th>Sana</th></tr>${d.quizzes.map(x=>`<tr><td>${x.level}</td><td>${x.score}/${x.total}</td><td>${x.created_at}</td></tr>`).join("")}</table>`:"Hali natija yo‘q"}).catch(e=>msg(message,e.message))</script></body></html>
