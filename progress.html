<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natijalarim — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">🇯🇵 NihongoHub</a><a class="button secondary" href="/dashboard.html">← Kabinet</a></nav><main class="page"><div class="page-heading"><div><h1>📈 Mening rivojlanishim</h1><p class="muted">Tugatilgan darslar va oxirgi test natijalari.</p></div></div><div id="summary" class="stats"></div><h2>Oxirgi testlar</h2><div id="results" class="table-wrap" style="margin-top:16px"></div></main><script>
async function init(){const me=await fetch('/api/me');if(!me.ok){location.href='/login.html';return}const r=await fetch('/api/progress');const d=await r.json();document.getElementById('summary').innerHTML=`<div class="stat"><strong>${d.completedLessons}/${d.totalLessons}</strong><span>Tugatilgan darslar</span><div class="progress-track"><div class="progress-fill" style="width:${d.percent}%"></div></div><span>${d.percent}% bajarildi</span></div><div class="stat"><strong>${d.quizzes.length}</strong><span>Oxirgi saqlangan test natijalari</span></div>`;const t=document.getElementById('results');if(!d.quizzes.length){t.innerHTML='<div class="empty">Hali test ishlanmagan.</div>';return}t.innerHTML='<table class="table"><thead><tr><th>Daraja</th><th>Natija</th><th>Sana</th></tr></thead><tbody>'+d.quizzes.map(q=>`<tr><td>${q.level}</td><td>${q.score}/${q.total} (${Math.round(q.score*100/q.total)}%)</td><td>${new Date(q.created_at.replace(' ','T')+'Z').toLocaleString()}</td></tr>`).join('')+'</tbody></table>'}init().catch(()=>location.href='/login.html');
</script></body></html>
