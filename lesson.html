<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dars — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">🇯🇵 NihongoHub</a><a class="button secondary" href="/my-lessons.html">← Darslar</a></nav><main class="page"><article class="card"><span id="level" class="level-pill"></span><h1 id="title">Dars yuklanmoqda...</h1><p id="description" class="muted"></p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div id="content" class="lesson-content"></div><div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap"><button id="complete" class="primary">✓ Darsni tugatdim</button><a class="button secondary" href="/quiz.html">Test ishlash →</a></div><p id="message" class="message"></p></article></main><script>
const id=new URLSearchParams(location.search).get('id');const msg=document.getElementById('message');async function init(){const me=await fetch('/api/me');if(!me.ok){location.href='/login.html';return}const r=await fetch('/api/lessons/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.message);document.title=d.title+' — NihongoHub';document.getElementById('title').textContent=d.title;document.getElementById('description').textContent=d.description;document.getElementById('level').textContent=d.level;document.getElementById('content').textContent=d.content||'Dars matni hali qo‘shilmagan.';if(d.completed){document.getElementById('complete').textContent='✓ Tugatilgan';document.getElementById('complete').className='secondary'}}document.getElementById('complete').onclick=async()=>{const r=await fetch('/api/lessons/'+encodeURIComponent(id)+'/complete',{method:'POST'});const d=await r.json();msg.textContent=d.message;msg.className='message success';document.getElementById('complete').textContent='✓ Tugatilgan';document.getElementById('complete').className='secondary'};init().catch(e=>{document.getElementById('title').textContent='Xatolik';msg.textContent=e.message});
</script></body></html>
