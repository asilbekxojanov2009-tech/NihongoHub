<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">JP NihongoHub</a><a href="/dashboard.html">Kabinet</a></header><main class="container"><h1>Mini-test</h1><div class="field"><label for="level">Daraja</label><select id="level"><option>N5</option><option>N4</option></select></div><div id="quiz"></div><button id="submit" class="btn">Natijani tekshirish</button><p id="message" class="form-error"></p></main><script src="/app.js"></script><script>const qs={N5:[["こんにちは nimani anglatadi?",["Salom","Rahmat","Xayr"],0],["水 ma’nosi?",["Olov","Suv","Oy"],1],["学生 kim?",["Talaba","Shifokor","Do‘st"],0]],N4:[["と思います ma’nosi?",["Deb o‘ylayman","Deb yozaman","Deb ketaman"],0],["たり〜たりします nimaga xizmat qiladi?",["Faoliyat sanash","Savol berish","Salomlashish"],0],["日本語はおもしろいと思います?",["Yapon tili qiziqarli deb o‘ylayman","Yapon tili yo‘q","Men yaponman"],0]]};function draw(){document.getElementById("quiz").innerHTML=qs[level.value].map((x,i)=>`<article class="card"><h2>${i+1}. ${x[0]}</h2>${x[1].map((a,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join("")}</article>`).join("")}level.onchange=draw;draw();submit.onclick=async()=>{let l=level.value,a=qs[l],score=a.reduce((n,x,i)=>n+(document.querySelector('input[name="q'+i+'"]:checked')?.value==x[2]?1:0),0);try{await api("/api/quiz-results",{method:"POST",body:JSON.stringify({level:l,score,total:a.length})});msg(message,`Natija ${score}/${a.length}. Saqlandi.`,true)}catch(e){msg(message,`Natija ${score}/${a.length}. ${e.message} Saqlash uchun login qiling.`)}}</script></body></html>
