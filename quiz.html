<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testlar — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">🇯🇵 NihongoHub</a><a class="button secondary" href="/dashboard.html">← Kabinet</a></nav><main class="page"><div class="page-heading"><div><h1>📝 Bilimingizni sinang</h1><p class="muted">Darajani tanlang va barcha savollarga javob bering.</p></div></div><div class="filters"><button class="primary" data-level="N5">N5 testi</button><button class="secondary" data-level="N4">N4 testi</button></div><form id="quizForm"><div id="questions" class="muted">Avval N5 yoki N4 ni tanlang.</div><button id="submit" class="primary hidden" type="submit">Javoblarni tekshirish</button></form><div id="result" class="message"></div></main><script>
const qs=document.getElementById('questions'),form=document.getElementById('quizForm'),result=document.getElementById('result'),submit=document.getElementById('submit');let level='',questions=[];async function start(l){const me=await fetch('/api/me');if(!me.ok){location.href='/login.html';return}level=l;result.textContent='';const r=await fetch('/api/quiz/'+l);questions=await r.json();qs.innerHTML='';questions.forEach((q,i)=>{const box=document.createElement('section');box.className='quiz-question';const h=document.createElement('h3');h.textContent=(i+1)+'. '+q.q;box.append(h);q.options.forEach((o,j)=>{const label=document.createElement('label');label.className='quiz-option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.required=true;const span=document.createElement('span');span.textContent=o;label.append(input,span);box.append(label)});qs.append(box)});submit.classList.remove('hidden')}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(b.dataset.level).catch(()=>location.href='/login.html'));form.onsubmit=async e=>{e.preventDefault();const answers=questions.map((_,i)=>{const v=form.querySelector(`input[name="q${i}"]:checked`);return v?Number(v.value):-1});if(answers.some(x=>x<0)){result.textContent='Barcha savollarga javob bering.';return}const r=await fetch('/api/quiz/'+level+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});const d=await r.json();result.className='message success';result.textContent=`Natija: ${d.score}/${d.total} (${d.percent}%). ${d.message}`;};
</script></body></html>
