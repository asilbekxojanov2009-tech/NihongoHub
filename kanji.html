<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanji</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">JP NihongoHub</a><a href="/dashboard.html">Kabinet</a></header><main class="container"><h1>Kanji lug‘ati</h1><div id="items" class="grid"></div></main><script src="/app.js"></script><script>api("/api/kanji").then(rows=>document.getElementById("items").innerHTML=rows.map(x=>`<article class="card"><div class="kanji">${esc(x.character)}</div><h2>${esc(x.meaning)}</h2><p>${esc(x.reading)}</p><p>${esc(x.example)}</p></article>`).join("")).catch(e=>document.getElementById("items").textContent=e.message)</script></body></html>
