<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanji lug‘ati — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">🇯🇵 NihongoHub</a><a class="button secondary" href="/dashboard.html">← Kabinet</a></nav><main class="page"><div class="page-heading"><div><h1>🈶 Kanji lug‘ati</h1><p class="muted">Belgilar, o‘qilishi, ma’nosi va misollarini takrorlang.</p></div></div><div id="list" class="kanji-grid">Yuklanmoqda...</div></main><script>
async function init(){const me=await fetch('/api/me');if(!me.ok){location.href='/login.html';return}const r=await fetch('/api/kanji');const items=await r.json();const list=document.getElementById('list');list.innerHTML='';items.forEach(k=>{const c=document.createElement('article');c.className='card';const ch=document.createElement('div');ch.className='kanji-char';ch.textContent=k.character;const read=document.createElement('h3');read.textContent=k.reading;const meaning=document.createElement('p');meaning.textContent=k.meaning;const ex=document.createElement('p');ex.className='muted';ex.textContent=k.example;c.append(ch,read,meaning,ex);list.append(c)})}init().catch(()=>location.href='/login.html');
</script></body></html>
