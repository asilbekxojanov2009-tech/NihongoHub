<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darslarim — NihongoHub</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><a class="logo" href="/">🇯🇵 NihongoHub</a><div class="nav-buttons"><a class="button secondary" href="/dashboard.html">← Kabinet</a></div></nav><main class="page"><div class="page-heading"><div><h1>📚 Yapon tili darslari</h1><p class="muted">Darajani tanlang va o‘rganishni boshlang.</p></div></div><div class="filters"><button class="secondary active" data-level="ALL">Barchasi</button><button class="secondary" data-level="N5">JLPT N5</button><button class="secondary" data-level="N4">JLPT N4</button></div><div id="list" class="grid"><p class="muted">Yuklanmoqda...</p></div></main><script>
const list=document.getElementById('list');let all=[];async function load(){const me=await fetch('/api/me');if(!me.ok){location.href='/login.html';return}const r=await fetch('/api/lessons');if(!r.ok){list.textContent='Darslarni yuklab bo‘lmadi.';return}all=await r.json();render('ALL')}function render(level){document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===level));const rows=level==='ALL'?all:all.filter(x=>x.level===level);list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">Bu darajada dars topilmadi.</div>';return}rows.forEach(l=>{const c=document.createElement('article');c.className='card lesson-card';c.innerHTML=`<span class="level-pill">${l.level}</span><h3></h3><p></p><p class="muted"></p><a class="button ${l.completed?'secondary':'primary'}" href="/lesson.html?id=${l.id}">${l.completed?'Qayta ko‘rish':'Darsni o‘rganish →'}</a>`;c.querySelector('h3').textContent=l.title;c.querySelectorAll('p')[0].textContent=l.description;c.querySelectorAll('p')[1].textContent=l.completed?'✅ Tugatilgan':'Hali tugatilmagan';list.append(c)})}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>render(b.dataset.level));load().catch(()=>location.href='/login.html');
</script></body></html>
